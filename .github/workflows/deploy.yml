name: Deploy Content Repurpose Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Create Deployment Package
        run: |
          cd server
          zip -r content-repurpose-latest.zip app

      - name: Upload Deployment Package to S3
        run: |
          aws s3 cp \
            server/content-repurpose-latest.zip \
            s3://webinspect-bucket/content-repurpose-latest.zip

      - name: Deploy on EC2 via SSM
        run: |
          cat > ssm-commands.json <<'EOF'
          {
            "commands": [
              "set -e",

              "APP_DIR=/home/ec2-user/content-repurpose",
              "APP_SUBDIR=/home/ec2-user/content-repurpose/app",
              "ZIP=/tmp/content-repurpose.zip",
              "ENV_BACKUP=/tmp/content-repurpose.env.bak",

              "echo '=== Stop PM2 ==='",
              "sudo -u ec2-user pm2 stop content-repurpose || true",
              "sudo -u ec2-user pm2 delete content-repurpose || true",

              "echo '=== Backup .env ==='",
              "[ -f $APP_SUBDIR/.env ] && cp $APP_SUBDIR/.env $ENV_BACKUP || true",

              "echo '=== Clean Old Deployment ==='",
              "rm -rf $APP_DIR",
              "mkdir -p $APP_DIR",
              "chown -R ec2-user:ec2-user $APP_DIR",

              "echo '=== Download Latest ZIP ==='",
              "aws s3 cp s3://webinspect-bucket/content-repurpose-latest.zip $ZIP",

              "echo '=== Extract ZIP ==='",
              "sudo -u ec2-user unzip -oq $ZIP -d $APP_DIR",

              "echo '=== Restore .env ==='",
              "mkdir -p $APP_SUBDIR",
              "[ -f $ENV_BACKUP ] && mv $ENV_BACKUP $APP_SUBDIR/.env || true",
              "[ -f $APP_SUBDIR/.env ] && chown ec2-user:ec2-user $APP_SUBDIR/.env || true",
              "[ -f $APP_SUBDIR/.env ] && chmod 600 $APP_SUBDIR/.env || true",

              "echo '=== Install Python 3.11 (if not present) ==='",
              "if ! command -v python3.11 &> /dev/null; then sudo amazon-linux-extras install python3.11 -y || sudo yum install python3.11 -y; fi",

              "echo '=== Create Virtual Environment ==='",
              "cd $APP_DIR",
              "rm -rf venv",
              "python3.11 -m venv venv",

              "echo '=== Upgrade pip ==='",
              "$APP_DIR/venv/bin/pip install --upgrade pip",

              "echo '=== Install Requirements ==='",
              "$APP_DIR/venv/bin/pip install -r $APP_SUBDIR/requirements.txt",

              "echo '=== Stop Existing PM2 Process ==='",
              "pm2 delete content-repurpose || true",

              "echo '=== Start FastAPI ==='",
              "cd $APP_DIR",
              "sudo -u ec2-user pm2 start $APP_DIR/venv/bin/python --interpreter none --name content-repurpose --cwd $APP_DIR -- -m uvicorn app.main:app --host 0.0.0.0 --port 8000",

              "sudo -u ec2-user pm2 save",

              "echo '=== Deployment Completed Successfully ==='"
            ]
          }
          EOF

          aws ssm send-command \
            --region ap-south-1 \
            --document-name "AWS-RunShellScript" \
            --targets '[{"Key":"InstanceIds","Values":["i-0219c11f642a8d920"]}]' \
            --comment "Deploy Content Repurpose Backend" \
            --timeout-seconds 900 \
            --parameters file://ssm-commands.json
