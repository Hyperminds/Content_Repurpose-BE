name: Deploy Content-Repurpose Backend to EC2 via S3 + SSM

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment zip
        run: |
          cd server
          zip -r ../content-repurpose.zip . \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x ".git/*" \
            -x ".github/*" \
            -x "app/venv/*" \
            -x "app/.env"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload zip to S3
        run: |
          aws s3 cp content-repurpose.zip s3://webinspect-bucket/content-repurpose-latest.zip

      - name: Deploy on EC2 via SSM
        run: |
          aws ssm send-command \
          --region ap-south-1 \
          --document-name "AWS-RunShellScript" \
          --targets '[{"Key":"InstanceIds","Values":["i-0219c11f642a8d920"]}]' \
          --comment "Deploy Content Repurpose Backend" \
          --timeout-seconds 900 \
          --parameters '{
            "commands":[
              "set -e",

              "APP_DIR=/home/ec2-user/content-repurpose",
              "APP_SUBDIR=$APP_DIR/app",
              "ZIP=/tmp/content-repurpose.zip",
              "ENV_BACKUP=/tmp/content-repurpose.env.bak",

              "echo === Stop PM2 ===",
              "sudo -u ec2-user pm2 stop content-repurpose || true",
              "sudo -u ec2-user pm2 delete content-repurpose || true",

              "echo === Backup .env ===",
              "[ -f $APP_SUBDIR/.env ] && cp $APP_SUBDIR/.env $ENV_BACKUP || true",

              "echo === Clean application ===",
              "rm -rf $APP_DIR",
              "mkdir -p $APP_DIR",
              "chown -R ec2-user:ec2-user $APP_DIR",

              "echo === Download artifact ===",
              "aws s3 cp s3://webinspect-bucket/content-repurpose-latest.zip $ZIP",

              "echo === Extract application ===",
              "sudo -u ec2-user unzip -oq $ZIP -d $APP_DIR",

              "echo === Restore .env ===",
              "mkdir -p $APP_SUBDIR",
              "[ -f $ENV_BACKUP ] && mv $ENV_BACKUP $APP_SUBDIR/.env || true",
              "[ -f $APP_SUBDIR/.env ] && chown ec2-user:ec2-user $APP_SUBDIR/.env || true",
              "[ -f $APP_SUBDIR/.env ] && chmod 600 $APP_SUBDIR/.env || true",

              "echo === Create Virtual Environment ===",
              "cd $APP_SUBDIR",
              "sudo -u ec2-user python3 -m venv venv",

              "echo === Install Dependencies ===",
              "sudo -u ec2-user bash -c \"cd $APP_SUBDIR && source venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt\"",

              "echo === Start Application ===",
              "sudo -u ec2-user bash -c \"cd $APP_SUBDIR && pm2 start 'venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000' --name content-repurpose\"",

              "sudo -u ec2-user pm2 save",

              "echo === Deployment Completed ==="
            ]
          }'

      - name: Deployment completed
        run: echo "Content Repurpose Backend deployed successfully!"
